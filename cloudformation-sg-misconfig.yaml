AWSTemplateFormatVersion: "2010-09-09"
Description: "Intentionally misconfigured AWS Security Group for security misconfiguration demonstration."

Parameters:
  TrustedAdminCidr:
    Type: String
    Description: "Trusted administrator IPv4 CIDR range for SSH and RDP access (e.g. 203.0.113.0/24)"
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid IPv4 CIDR block."
  TrustedAdminIpv6Cidr:
    Type: String
    Description: "Trusted administrator IPv6 CIDR range for RDP access (e.g. 2001:db8::/32)"
    AllowedPattern: "^[0-9a-fA-F:]+/[0-9]+$"
    ConstraintDescription: "Must be a valid IPv6 CIDR block."

Resources:
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "SG with multiple misconfigs"
      SecurityGroupIngress:
        # 4.2 - RDP restricted to trusted admin network
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref TrustedAdminCidr
          Description: "RDP from trusted admin network"
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIpv6: !Ref TrustedAdminIpv6Cidr
          Description: "RDP from trusted admin network (IPv6)"
        # EC2.18 - Unrestricted incoming traffic on unauthorized ports
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        # More: SSH restricted to trusted admin network
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref TrustedAdminCidr
          Description: "SSH from trusted admin network"
        # More: All traffic open (should never be allowed)
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        # Allow all outbound (default, but often flagged if not restricted)
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

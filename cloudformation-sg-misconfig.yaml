AWSTemplateFormatVersion: "2010-09-09"
Description: "Intentionally misconfigured AWS Security Group for security misconfiguration demonstration."

Resources:
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudformation-sg-service-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudformation-sg-service-role-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: '*'


  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "SG with multiple misconfigs"
      SecurityGroupIngress:
        # 4.2 - RDP open to the world
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIpv6: "::/0"
        # EC2.18 - Unrestricted incoming traffic on unauthorized ports
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        # More: SSH open to the world (should be restricted)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # More: All traffic open (should never be allowed)
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        # Allow all outbound (default, but often flagged if not restricted)
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

Outputs:
  CloudFormationServiceRoleArn:
    Description: "ARN of the CloudFormation service role for this stack"
    Value: !GetAtt CloudFormationServiceRole.Arn

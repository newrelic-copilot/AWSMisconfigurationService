AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS Security Group with restricted least-privilege rules."

Resources:
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Default VPC security group with restricted rules"
      SecurityGroupIngress:
        # Allow inbound HTTPS only from a trusted CIDR range
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        # Allow outbound HTTPS only
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

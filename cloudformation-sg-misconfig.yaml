AWSTemplateFormatVersion: "2010-09-09"
Description: "Intentionally misconfigured AWS Security Group for security misconfiguration demonstration."

Resources:
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "SG with multiple misconfigs"
      SecurityGroupIngress:
        # 4.2 - RDP restricted to trusted admin CIDR
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 10.0.0.0/8
          Description: "RDP allowed only from trusted admin CIDR"
        # EC2.18 - Port 8080 restricted to trusted CIDR
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.0.0.0/8
          Description: "Port 8080 allowed only from trusted CIDR"
        # SSH restricted to trusted admin CIDR
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
          Description: "SSH allowed only from trusted admin CIDR"
      SecurityGroupEgress:
        # Allow all outbound (default, but often flagged if not restricted)
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

AWSTemplateFormatVersion: "2010-09-09"
Description: "Intentionally misconfigured AWS Security Group for security misconfiguration demonstration."

Resources:
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "SG with multiple misconfigs"
      SecurityGroupIngress:
        # Allow HTTP traffic only
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        # Allow HTTPS traffic only
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        # Allow all outbound (default, but often flagged if not restricted)
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: MisconfiguredSecurityGroup
        - Key: Environment
          Value: SecurityTesting
        - Key: Purpose
          Value: "Intentionally vulnerable for testing"
        - Key: SecurityRisk
          Value: high
        - Key: MonitoringTarget
          Value: "true"
